<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>リモコン</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: #05070a;
    color: #baffe0;
    font-family: "Share Tech Mono", monospace, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 420px;
    padding: 24px;
    text-align: center;
  }
  h1 {
    font-size: 16px;
    letter-spacing: 2px;
    color: #6fd6ab;
    margin: 0 0 18px;
    font-weight: normal;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #ff9a4d;
    margin-bottom: 22px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff5a5a;
    box-shadow: 0 0 8px #ff5a5a;
  }
  .status.ok .dot { background: #4dffb0; box-shadow: 0 0 8px #4dffb0; }
  .status.ok { color: #4dffb0; }

  .flash-btn {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 60vh;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #1b4a34, #06120c 75%);
    border: 3px solid #245c43;
    color: #4dffb0;
    font-family: "VT323", monospace, sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 0 30px rgba(77,255,176,0.15);
    transition: transform 0.08s, box-shadow 0.15s, opacity 0.3s;
  }
  .flash-btn:active {
    transform: scale(0.96);
    box-shadow: 0 0 55px rgba(77,255,176,0.75);
  }
  .flash-btn.sending { opacity: 0.5; }

  .hint { margin-top: 18px; font-size: 12px; color: #2fa876; line-height: 1.6; }
  .debug {
    display: none;
    margin-top: 16px;
    background: #1a0a0a;
    border: 1px solid #7a2e2e;
    color: #ff9a9a;
    font-size: 11px;
    text-align: left;
    padding: 8px 10px;
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>&gt; REMOTE CONTROL LINK</h1>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">接続確認中...</span></div>

  <button class="flash-btn" id="flashBtn">FLASH</button>

  <div class="hint">画面がスリープしていると通信できないことがあります。<br>ボタンを押して本体画面を一瞬点灯させます。</div>
  <div class="debug" id="debugBox"></div>
</div>

<script>
  /* ============================================================
     CONFIG - Google Apps Script (スプレッドシート連携)のWebアプリURLを設定する
     genius-pc-screen 側の index.html と同じURLを設定すること
     ============================================================ */
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwzZW_INYSV1JMqTSSi8YQWeht_25mp90dnnhxaS6QlDeY09AgqCuBHYBWyF14zFsfx9w/exec";

  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const flashBtn = document.getElementById("flashBtn");
  const debugBox = document.getElementById("debugBox");

  function setStatus(ok, text) {
    statusText.textContent = text;
    statusEl.classList.toggle("ok", ok);
  }

  function showDebug(text) {
    console.error(text);
    debugBox.textContent = text;
    debugBox.style.display = "block";
  }

  async function checkBackend() {
    try {
      const res = await fetch(BACKEND_URL + "?action=ping", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      await res.json();
      setStatus(true, "接続OK");
    } catch (err) {
      setStatus(false, "接続エラー");
      showDebug("ping error: " + (err && err.message ? err.message : String(err)));
    }
  }
  checkBackend();

  flashBtn.addEventListener("click", async () => {
    flashBtn.classList.add("sending");
    try {
      const res = await fetch(BACKEND_URL + "?action=flash", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      await res.json();
      setStatus(true, "送信しました");
    } catch (err) {
      setStatus(false, "送信エラー");
      showDebug("flash error: " + (err && err.message ? err.message : String(err)));
    } finally {
      setTimeout(() => flashBtn.classList.remove("sending"), 200);
    }
  });
</script>
</body>
</html>
